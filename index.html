<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body,
      html {
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body></body>
  <script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
  <script src="https://unpkg.com/kaplay@3001.0.19/dist/kaplay.js"></script>
  <script>
    nn.on("load", () => {
      kaplay({
        background: "#76dce8",
      });

      // Enable Gravity //
      setGravity(1200);

      // Load Audio Files //
      loadSound("collect", "media/collect.wav");
      loadSound("soundtrack", "media/soundtrack.mp3");
      loadSound("jump", "media/jump.mp3");

      // Load Sprites //
      loadSprite("player", "media/postal-worker.png");
      loadSprite("envelope", "media/envelope.png");
      loadSprite("shippingBox", "media/shipping-box.png");

      // Start Background Music //
      play("soundtrack", {
        loop: true,
        volume: 0.1,
      });

      // Player //
      const player = add([
        sprite("player"),
        scale(1 / 10),
        pos(0, -300),
        area(),
        body(),
        stay(),
        "player",
        { speed: 600 },
      ]);

      // Stopwatch Timer //
      const timer = add([
        text("00:00"),
        pos(24, 24),
        { value: 0, isRunning: false },
        fixed(),
        stay(),
      ]);

      // Packages Counter //
      const packageCounter = add([
        text("Packages Remaining: 0"),
        pos(24, 56),
        { value: 0 },
        fixed(),
        stay(),
      ]);

      // Moving Left //
      player.onKeyDown("a", () => {
        player.move(-player.speed, 0);
      });

      // Moving Right //
      player.onKeyDown("d", () => {
        player.move(player.speed, 0);
      });

      // Jumping //
      player.onKeyDown("space", () => {
        // Only if player is touching the ground //
        if (player.isGrounded()) {
          play("jump", {
            volume: 0.5,
          });
          player.jump(700);
        }
      });

      // Collecting Package //
      player.onCollide("collectable", (item) => {
        // Play sound //
        play("collect", {
          volume: 0.3,
        });

        // Add item to player inventory //
        item.use(follow(player, vec2(rand(20), 50 + rand(20))));
        item.scaleBy(0.7);

        // Increment Packages Count //
        packageCounter.value++;
        packageCounter.text = "Packages: " + packageCounter.value;
      });

      // Hitting Entity or Obstacle //
      player.onCollide("obstacle", () => {
        resetPlayer();
      });

      player.onUpdate(() => {
        // Update timer and format in mm:ss.ms format //
        if (timer.isRunning) {
          timer.value += dt();

          let seconds = Math.floor(timer.value % 60);
          let milliseconds = Math.floor((timer.value % 1) * 100);
          let minutes = Math.floor(timer.value / 60);

          timer.text = `${minutes < 10 ? "0" + minutes : minutes}:${seconds < 10 ? "0" + seconds : seconds}.${milliseconds < 10 ? "0" + milliseconds : milliseconds}`;
        }

        // Respawn player if they fall off of the map //
        if (player.pos.y > 1000) {
          resetPlayer();
        }

        // Position the camera to follow the player //
        setCamPos(player.pos);
      });

      // Reset Player //
      function resetPlayer() {
        player.pos = vec2(0, -300);
        player.vel = vec2(0);
      }

      scene("air", () => {
        // Set Package Counter //
        packageCounter.value = 4;
        packageCounter.text = `Packages Remaining: ${packageCounter.value}`;

        // Add Platforms //
        add([pos(0, 0), rect(700, 40), area(), body({ isStatic: true })]);
        add([pos(1100, 100), rect(500, 60), area(), body({ isStatic: true })]);
        add([pos(300, 250), rect(600, 50), area(), body({ isStatic: true })]);
        add([pos(1900, 200), rect(600, 50), area(), body({ isStatic: true })]);
        add([pos(-600, 450), rect(700, 40), area(), body({ isStatic: true })]);
        add([pos(2400, 400), rect(400, 60), area(), body({ isStatic: true })]);

        // Add Decorations //

        // Add Obstacles //
        add([
          pos(200, -50),
          rect(50, 50),
          area(),
          color(255, 90, 48),
          "obstacle",
        ]);

        // Add Entities //

        // Add Packages //
        add([
          sprite("envelope"),
          pos(2200, 160),
          scale(1 / 10),
          area(),
          "collectable",
        ]);

        add([
          sprite("shippingBox"),
          pos(-540, 410),
          scale(1 / 10),
          area(),
          "collectable",
        ]);

        // Add Postal Office //

        // Start Game //
        timer.isRunning = true;
      });

      go("air");
    });
  </script>
</html>
