<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body,
      html {
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body></body>
  <script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
  <script src="https://unpkg.com/kaplay@3001.0.19/dist/kaplay.js"></script>
  <script>
    nn.on("load", () => {
      kaplay({
        background: "#76dce8",
      });

      // Enable Gravity //
      setGravity(1000);

      // Load Audio Files //
      loadSound("collect", "media/collect.wav");
      loadSound("soundtrack", "media/soundtrack.mp3");
      loadSound("jump", "media/jump.mp3");

      // Start Background Music //
      play("soundtrack", {
        loop: true,
        volume: 0.1,
      });

      // Player //
      loadSprite("player", "media/postal-worker.png");
      const player = add([
        sprite("player"),
        scale(1 / 10),
        pos(0, -300),
        area(),
        body(),
        "player",
      ]);

      // Shipping Box //
      loadSprite("shippingBox", "media/shipping-box.png");
      const shippingBox = add([
        sprite("shippingBox"),
        scale(1 / 10),
        pos(600, -50),
        area(),
        "collectable",
      ]);

      // Mail //
      loadSprite("envelope", "media/envelope.png");
      const envelope1 = add([
        sprite("envelope"),
        scale(1 / 10),
        pos(200, 160),
        area(),
        "collectable",
      ]);

      // Platform Generator //
      const platformArray = [
        [800, 400, 800],
        [500, 200, 600, 200, 500],
      ];
      const fallingCutoff = generatePlatforms(platformArray);

      // Stopwatch Timer //
      const timer = add([
        text("00:00"),
        pos(24, 24),
        { value: 0, isRunning: true },
        fixed(),
      ]);

      // Packages Counter //
      const packageCounter = add([
        text("Packages: 0"),
        pos(24, 56),
        { value: 0 },
        fixed(),
      ]);

      // Moving Left //
      onKeyDown("a", () => {
        player.move(-500, 0);
      });

      // Moving Right //
      onKeyDown("d", () => {
        player.move(500, 0);
      });

      // Jumping //
      onKeyDown("space", () => {
        // Only if player is touching the ground //
        if (player.isGrounded()) {
          play("jump", {
            volume: 0.5,
          });
          player.jump(700);
        }
      });

      player.onUpdate(() => {
        // Respawn player if they fall off of the map //
        if (player.pos.y > fallingCutoff) {
          player.pos = vec2(0, -300);
          player.vel = vec2(0);
        }

        // Position the camera to follow the player //
        setCamPos(player.pos);
      });

      player.onCollide("collectable", (item) => {
        // Play sound //
        play("collect", {
          volume: 0.3,
        });

        // Add item to player inventory //
        item.destroy();
        player.add(item);
        item.scaleTo(0.7);
        item.pos = vec2(-300 + rand(200), 500 + rand(200));

        // Increment Packages Count //
        packageCounter.value++;
        packageCounter.text = "Packages: " + packageCounter.value;
      });

      onUpdate(() => {
        // Update timer and format in mm:ss.ms format //
        if (timer.isRunning) {
          timer.value += dt();

          let seconds = Math.floor(timer.value % 60);
          let milliseconds = Math.floor((timer.value % 1) * 100);
          let minutes = Math.floor(timer.value / 60);

          timer.text = `${minutes < 10 ? "0" + minutes : minutes}:${seconds < 10 ? "0" + seconds : seconds}.${milliseconds < 10 ? "0" + milliseconds : milliseconds}`;
        }
      });
    });

    function generatePlatforms(platformArray) {
      // Inital height to 0 //
      let height = 0;

      // Go through each level //
      for (let y = 0; y < platformArray.length; y++) {
        // Go through each platform //
        let offset = 0;
        for (let x = 0; x < platformArray[y].length; x += 2) {
          // First number is width, second number is gap //
          add([
            rect(platformArray[y][x], 30),
            pos(offset + platformArray[y][x - 1] || 0, height),
            color(255, 255, 255),
            area(),
            body({ isStatic: true }),
          ]);

          // Update platform offset //
          offset += (platformArray[y][x - 1] || 0) + platformArray[y][x];
        }

        // Increment height for next level //
        height += 200;
      }

      // return height to respawn at //
      return height + 500;
    }
  </script>
</html>
