<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body,
      html {
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body></body>
  <script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
  <script src="https://unpkg.com/kaplay@3001.0.19/dist/kaplay.js"></script>
  <script>
    nn.on("load", () => {
      kaplay({
        background: [35, 106, 219],
      });

      setGravity(1000);

      const player = add([
        rect(40, 60),
        pos(400, 300),
        color("#7bc924"),
        area(),
        body(),
        "player",
      ]);

      const obj1 = add([
        rect(400, 30),
        pos(300, 600),
        color([255, 0, 255]),
        area(),
        body({ isStatic: true }),
      ]);

      const obj2 = add([
        rect(300, 30),
        pos(800, 500),
        color([255, 0, 255]),
        area(),
        body({ isStatic: true }),
      ]);

      onKeyDown("a", () => {
        player.move(-500, 0);
      });

      onKeyDown("d", () => {
        player.move(500, 0);
      });

      onKeyDown("space", () => {
        if (player.isGrounded()) {
          player.jump(500);
        }
      });

      player.onUpdate(() => {
        if (player.pos.y > 800) {
          player.pos.y = 300;
          player.vel = vec2(0);
        }
      });
    });
  </script>
</html>
